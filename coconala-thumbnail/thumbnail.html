<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ココナラ サムネイル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy2:#13305a;--gold:#D4AF5F;--gold2:#F0D58F;--ink:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:850px;font-family:'Noto Sans JP',sans-serif;background:var(--navy);color:var(--ink);overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:
  radial-gradient(900px 600px at 85% 10%,rgba(212,175,95,.18),transparent 60%),
  linear-gradient(135deg,#0B1F3A 0%,#102a4f 100%)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px}
.frame{position:absolute;inset:26px;border:3px solid var(--gold);border-radius:6px}
.frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(212,175,95,.45);border-radius:3px}
.wrap{position:absolute;inset:26px;padding:64px 70px;display:flex;flex-direction:column}
.tag{align-self:flex-start;background:var(--gold);color:var(--navy);font-weight:900;font-size:34px;padding:8px 28px;letter-spacing:.06em;border-radius:4px}
.lead{margin-top:34px;font-weight:700;font-size:42px;color:var(--gold2);letter-spacing:.04em}
h1{font-family:'Noto Serif JP',serif;font-weight:900;font-size:112px;line-height:1.18;margin-top:10px;letter-spacing:.02em;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 em{font-style:normal;color:var(--gold)}
.sub{margin-top:26px;font-size:40px;font-weight:700;line-height:1.5;letter-spacing:.03em}
.sub b{color:var(--gold2);font-weight:900}
.badge{position:absolute;right:72px;bottom:66px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F7E3A6,#D4AF5F 60%,#B8922F);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4);border:6px solid #fff3}
.badge small{font-size:27px;line-height:1.1}
.badge span{font-size:60px;line-height:1.05;letter-spacing:.02em}
.badge::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(11,31,58,.55);border-radius:50%}
.chat{position:absolute;right:90px;top:92px;opacity:.95}
.foot{position:absolute;left:70px;bottom:52px;font-size:30px;font-weight:700;color:#cfd8e6;letter-spacing:.06em;display:flex;align-items:center;gap:16px}
.foot i{display:inline-block;width:56px;height:3px;background:var(--gold)}
.bottomband{position:absolute;left:0;right:0;bottom:0;height:0}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="frame"></div>

<svg class="chat" width="300" height="200" viewBox="0 0 300 200" fill="none">
  <rect x="6" y="6" width="180" height="104" rx="22" fill="#13305a" stroke="#D4AF5F" stroke-width="5"/>
  <path d="M40 110 L34 148 L78 110Z" fill="#13305a" stroke="#D4AF5F" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="62" cy="58" r="9" fill="#D4AF5F"/><circle cx="96" cy="58" r="9" fill="#D4AF5F"/><circle cx="130" cy="58" r="9" fill="#D4AF5F"/>
  <rect x="120" y="86" width="168" height="98" rx="22" fill="#D4AF5F"/>
  <path d="M262 184 L270 196 L236 184Z" fill="#D4AF5F"/>
  <path d="M150 126 l14 14 l32 -34" stroke="#0B1F3A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="214" y="118" width="54" height="9" rx="4.5" fill="#0B1F3A" opacity=".6"/><rect x="214" y="140" width="38" height="9" rx="4.5" fill="#0B1F3A" opacity=".6"/>
</svg>

<div class="wrap" id="root"></div>
<div class="badge"><small>初回相談</small><span>無料</span></div>
<div class="foot"><i></i>店舗オーナー・中小企業の方へ</div>

<script>
const V={
 a:{tag:'AI業務効率化 ｜ 相談・導入支援',lead:'AIって、何から始めれば…？',h1:'その悩み、<br><em>丁寧に整理</em>します',sub:'まずは<b>じっくりヒアリング</b>。専門用語なしで<br>ご相談いただけます。'},
 b:{tag:'AI業務効率化 ｜ 相談・導入支援',lead:'毎日の事務作業に追われていませんか？',h1:'その作業、<br><em>AIで半分</em>に。',sub:'お店・会社の状況を<b>丁寧にヒアリング</b>し、<br>無理なく続く形で導入をお手伝い。'},
 c:{tag:'店舗オーナー・中小企業さま向け',lead:'AI活用、はじめの一歩から',h1:'AI導入、<br><em>まるっと相談</em>OK',sub:'<b>聞くこと</b>を大切に、貴社に合う使い方を<br>一緒に見つけます。'}
};
const k=new URLSearchParams(location.search).get('v')||'a';
const d=V[k];
document.getElementById('root').innerHTML=`<div class="tag">${d.tag}</div><div class="lead">${d.lead}</div><h1>${d.h1}</h1><div class="sub">${d.sub}</div>`;
if(k==='c'){document.querySelector('.foot').innerHTML='<i></i>AI業務効率化 ｜ 相談・導入支援';}
</script>
</body>
</html>
