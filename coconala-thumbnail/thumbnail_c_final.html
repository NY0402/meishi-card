<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ココナラ サムネイル C案 仕上げ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--gold:#D4AF5F;--gold2:#F0D58F}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1220px;height:1016px;font-family:'Noto Sans JP',sans-serif;background:var(--navy);color:#fff;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 85% 8%,rgba(212,175,95,.2),transparent 60%),linear-gradient(135deg,#0B1F3A,#102a4f)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px}
.frame{position:absolute;inset:26px;border:3px solid var(--gold);border-radius:6px}
.frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(212,175,95,.45);border-radius:3px}
.tag{position:absolute;left:84px;top:110px;background:var(--gold);color:var(--navy);font-weight:900;font-size:34px;padding:8px 28px;letter-spacing:.06em;border-radius:4px}
.lead{position:absolute;left:84px;top:208px;font-weight:700;font-size:44px;color:var(--gold2);letter-spacing:.04em}
h1{position:absolute;left:78px;top:290px;font-family:'Noto Serif JP',serif;font-weight:900;font-size:118px;line-height:1.2;letter-spacing:.02em;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 em{font-style:normal;color:var(--gold)}
.sub{position:absolute;left:84px;top:600px;font-size:42px;font-weight:700;line-height:1.55;letter-spacing:.03em}
.sub b{color:var(--gold2);font-weight:900}
.points{position:absolute;left:84px;top:775px;display:flex;gap:18px}
.points span{border:2px solid var(--gold);color:var(--gold2);font-weight:700;font-size:30px;padding:8px 22px;border-radius:40px;background:rgba(212,175,95,.08)}
.badge{position:absolute;right:76px;top:96px;width:236px;height:236px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F7E3A6,#D4AF5F 60%,#B8922F);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.badge::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(11,31,58,.55);border-radius:50%}
.badge small{font-size:27px}.badge span{font-size:60px;line-height:1.05}
.foot{position:absolute;left:84px;top:880px;font-size:30px;font-weight:700;color:#cfd8e6;letter-spacing:.06em;display:flex;align-items:center;gap:16px}
.foot i{display:inline-block;width:56px;height:3px;background:var(--gold)}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div class="frame"></div>
<div class="tag">店舗オーナー・中小企業さま向け</div>
<div class="lead">AI活用、はじめの一歩から</div>
<h1>AI導入、<br><em>まるっと</em>相談OK</h1>
<div class="sub"><b>聞くこと</b>を大切に、貴社に合う使い方を<br>一緒に見つけます。</div>
<div class="points"><span>丁寧なヒアリング</span><span>専門用語なし</span></div>
<div class="foot"><i></i>AI業務効率化 ｜ 相談・導入支援</div>
<div class="badge"><small>初回相談</small><span>無料</span></div>
</body></html>
